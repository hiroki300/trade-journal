name: tests

# index.html (ビルド無しの単一ファイル) の回帰テスト。
# tests/*.test.js はインライン <script> から関数を取り出して node:vm で評価する。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: |
          set -e
          for t in tests/*.test.js; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done
